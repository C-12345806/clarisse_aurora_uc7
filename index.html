<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Cadastro Aurora</title>
    <link rel="stylesheet" href="css/style_index.css">
</head>
<body>

    <div class="container">

        <!-- Lado esquerdo -->
        <div class="lado-esquerdo">

            <div class="logo">
               
            </div>

        </div>

        <!-- Lado direito -->
        <div class="lado-direito">

            <div class="card">

                <h1>Cadastro</h1>

                <p class="subtitulo">
                    Crie uma conta aqui.
                </p>

                <form action="#" method="post">

                    <label for="nome">Nome completo:</label>
                    <input
                        type="text"
                        id="nome"
                        name="nome"
                        placeholder="Digite seu nome"
                        required
                    >

                    <label for="email">E-mail:</label>
                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Digite seu e-mail"
                        required
                    >

                    <label for="senha">Crie uma senha:</label>
                    <input
                        type="password"
                        id="senha"
                        name="senha"
                        placeholder="Mínimo de 8 caracteres"
                        minlength="8"
                        required
                    >

                    <button type="submit" class="btn">
                        
                        <a href="inicio.html">Entrar</a>  
                    </button>

                </form>

                <p class="texto">
                    Já tem conta?
                    <a href="login.html">Entre aqui</a>
                </p>

            </div>

        </div>

    </div>

</body>
</html>
