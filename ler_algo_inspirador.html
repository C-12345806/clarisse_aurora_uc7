        </div>

        <!-- Segunda frase -->

            <p class="texto">"A calma que você busca começa dentro de você."</p>
            <div class="icones">

            </div>
        </div>

        <!-- Terceira frase -->
        <div class="card">
            <p class="texto">
                "Pequenos passos hoje, grandes mudanças amanhã."
            </p>
            <div class="icones">

            </div>
        </div>
